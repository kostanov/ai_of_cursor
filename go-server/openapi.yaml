openapi: 3.1.0
info:
  title: ai-of-cursor Go Server API
  description: |
    HTTP API портированного сервера из `api.py`.
    SQLite (`test.db`), JSON-ответы, сервер по умолчанию на `0.0.0.0:8080`.
  version: 0.1.0
  contact:
    name: ai-of-cursor

servers:
  - url: http://127.0.0.1:8080
    description: Локальная разработка
  - url: http://0.0.0.0:8080
    description: Адрес по умолчанию из config

tags:
  - name: users
    description: Пользователи в SQLite
  - name: active
    description: Список активных пользователей (in-memory)
  - name: demo
    description: Демонстрационные эндпоинты

paths:
  /adduser:
    post:
      tags: [users]
      summary: Создать пользователя
      description: Добавляет запись в таблицу `users`. Имя обрезается по краям (`TrimSpace`).
      operationId: addUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddUserRequest'
            examples:
              alice:
                value:
                  name: Alice
      responses:
        '201':
          description: Пользователь создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddUserResponse'
              examples:
                created:
                  value:
                    status: ok
                    id: 1
                    name: Alice
        '400':
          description: Невалидный JSON или пустое имя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              examples:
                invalidJson:
                  value:
                    error: invalid json
                nameRequired:
                  value:
                    error: name is required
        '405':
          $ref: '#/components/responses/MethodNotAllowedPost'
        '500':
          description: Ошибка записи в БД
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                error: db_insert_failed

  /user/{uid}:
    get:
      tags: [users]
      summary: Получить пользователя по id
      operationId: getUser
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Пользователь найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: 1
                name: Alice
        '400':
          description: Некорректный id в пути
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                error: invalid_user_id
        '404':
          description: Пользователь не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                error: not_found
        '405':
          $ref: '#/components/responses/MethodNotAllowedGet'
        '500':
          description: Ошибка чтения из БД
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                error: db_query_failed

  /activate/{uid}:
    get:
      tags: [active]
      summary: Пометить пользователя активным (GET)
      description: |
        Добавляет `uid` в потокобезопасный список активных (лимит 100).
        Перед ответом — задержка ~100 ms (`ActivateDelay`).
      operationId: activateUserGet
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          $ref: '#/components/responses/ActivateOk'
        '400':
          $ref: '#/components/responses/InvalidUserId'
        '405':
          $ref: '#/components/responses/MethodNotAllowedGetPost'
    post:
      tags: [active]
      summary: Пометить пользователя активным (POST)
      operationId: activateUserPost
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          $ref: '#/components/responses/ActivateOk'
        '400':
          $ref: '#/components/responses/InvalidUserId'
        '405':
          $ref: '#/components/responses/MethodNotAllowedGetPost'

  /slow:
    get:
      tags: [demo]
      summary: Запланировать фоновую CPU-задачу
      description: |
        Запускает `SlowTask` в отдельной goroutine и сразу возвращает `202`.
        Итераций по умолчанию: 200_000 (`SlowTaskIterations`).
      operationId: slow
      responses:
        '202':
          description: Задача поставлена в фон
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
              example:
                status: scheduled
        '405':
          $ref: '#/components/responses/MethodNotAllowedGet'

  /wrong:
    get:
      tags: [demo]
      summary: Демонстрация обработки ошибки
      description: Всегда возвращает `500` с телом «division by zero».
      operationId: wrong
      responses:
        '500':
          description: Симулированная ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WrongErrorBody'
              example:
                msg: error
                detail: division by zero
        '405':
          $ref: '#/components/responses/MethodNotAllowedGet'

components:
  parameters:
    UserId:
      name: uid
      in: path
      required: true
      description: Целочисленный идентификатор пользователя
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 1

  schemas:
    AddUserRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          description: Имя пользователя (после TrimSpace не должно быть пустым)
      additionalProperties: false

    AddUserResponse:
      type: object
      required: [status, id, name]
      properties:
        status:
          type: string
          const: ok
        id:
          type: integer
          format: int64
        name:
          type: string
      additionalProperties: false

    User:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
      additionalProperties: false

    ActivateResponse:
      type: object
      required: [status, active]
      properties:
        status:
          type: string
          const: ok
        active:
          type: array
          description: Копия текущего списка активных id (до 100 элементов)
          items:
            type: integer
            format: int64
      additionalProperties: false

    StatusResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
      additionalProperties: false

    ErrorBody:
      type: object
      required: [error]
      properties:
        error:
          type: string
      additionalProperties: false

    WrongErrorBody:
      type: object
      required: [msg, detail]
      properties:
        msg:
          type: string
        detail:
          type: string
      additionalProperties: false

  responses:
    ActivateOk:
      description: Пользователь добавлен в список активных
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ActivateResponse'
          example:
            status: ok
            active: [1, 2]

    InvalidUserId:
      description: Некорректный id в пути
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
          example:
            error: invalid_user_id

    MethodNotAllowedGet:
      description: Разрешён только GET
      headers:
        Allow:
          schema:
            type: string
          example: GET
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
          example:
            error: method_not_allowed

    MethodNotAllowedPost:
      description: Разрешён только POST
      headers:
        Allow:
          schema:
            type: string
          example: POST
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
          example:
            error: method_not_allowed

    MethodNotAllowedGetPost:
      description: Разрешены GET и POST
      headers:
        Allow:
          schema:
            type: string
          example: GET, POST
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
          example:
            error: method_not_allowed
